<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F9FA" />
    <meta name="description" content="打开就能记。支出和收入只留在这台手机上。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="记账本" />
    <title>记账本</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=14" />
  </head>
  <body>
    <div class="sheet" id="app">
      <canvas id="fx" class="fx" aria-hidden="true"></canvas>
      <main id="view" tabindex="-1"></main>
      <nav class="tabs" aria-label="账本">
        <button type="button" data-act="tab" data-tab="record">记账</button>
        <button type="button" data-act="tab" data-tab="bills">账单</button>
        <button type="button" data-act="tab" data-tab="month">月结</button>
      </nav>
      <div id="toast" class="toast" hidden></div>
      <p id="live" class="sr" aria-live="polite"></p>
    </div>
    <noscript><p class="noscript">记账本需要开启 JavaScript。</p></noscript>
    <script type="module" src="app.js?v=14"></script>
  </body>
</html>
